# Optional local configuration. Environment variables override these values.
data_dir: .reverserx
log_level: INFO
default_token_budget: 60000
max_agent_steps: 30
max_tool_retries: 2
max_run_cost_usd: 5.0
max_agent_input_tokens: 500000
max_agent_output_tokens: 100000
max_agent_wall_time_seconds: 3600
max_tool_duration_seconds: 900
model_output_tokens_per_call: 4096
hosted_models_enabled: true
openai_model: gpt-5.6-sol
openai_base_url: https://api.openai.com/v1
openai_input_cost_per_million: 5.0
openai_output_cost_per_million: 30.0
openai_image_cost_per_million: 5.0
ollama_model: gpt-oss:20b
ollama_base_url: http://127.0.0.1:11434
ollama_image_support: false
provider_timeout_seconds: 120
