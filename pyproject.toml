[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reverserx"
version = "0.2.0"
description = "AI-orchestrated reverse-engineering platform for authorized Android, API, and native analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Sandeep Satheesh", email = "sandeep.sath7@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
]
phase1 = [
  "chromadb>=1.5.9,<2",
  "numpy>=2.1,<2.4",
  "regex>=2025.7.34,<2027",
]

[project.scripts]
reverserx = "reverserx.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reverserx = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=reverserx --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["reverserx"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
